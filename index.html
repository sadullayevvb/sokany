<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sokany do‘kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17191d;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}.top{background:#111827;color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:2}.top h1{margin:0 0 12px;font-size:23px}.search{width:100%;border:0;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}.wrap{padding:14px 12px 90px}.meta{font-size:13px;color:#6b7280;margin:2px 3px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 1px 5px #1111;min-width:0}.photo{display:block;width:100%;aspect-ratio:1.38/1;object-fit:contain;object-position:center;background:#fff;padding:4px;image-rendering:auto}.info{padding:10px}.name{font-size:14px;font-weight:650;line-height:1.3;min-height:36px}.sku{font-size:12px;color:#777;margin:6px 0}.price{font-size:16px;font-weight:750;color:#111827}.qty{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.qty button{width:32px;height:32px;border:0;border-radius:8px;background:#111827;color:white;font-size:20px}.qty span{font-weight:700;min-width:20px;text-align:center}.cart-toggle{position:fixed;right:14px;bottom:54px;z-index:4;border:0;border-radius:24px;background:#111827;color:white;padding:12px 18px;box-shadow:0 3px 12px #0003}.cart-panel{display:none;position:fixed;z-index:5;inset:0;background:#0007;align-items:flex-end}.cart-box{background:white;border-radius:18px 18px 0 0;width:100%;max-height:75vh;overflow:auto;padding:20px}.cart-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.cart-close{float:right}.empty{text-align:center;padding:45px 15px;color:#777;grid-column:1/-1}.admin-btn{float:right;background:#374151;color:#fff;border:0;border-radius:9px;padding:8px 12px;font-size:13px}.admin-layer{position:fixed;inset:0;background:#0008;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.admin-box{background:#fff;border-radius:16px;padding:22px;width:min(100%,360px);box-shadow:0 10px 40px #0003}.admin-box h2{margin:0 0 16px}.admin-box input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;margin:6px 0;font-size:16px}.admin-box button{width:100%;padding:12px;border:0;border-radius:9px;background:#111827;color:#fff;margin-top:10px;font-size:15px}.admin-error{color:#dc2626;font-size:13px;min-height:18px}.admin-panel{display:none;background:#fff;margin:14px 12px;padding:18px;border-radius:14px}.admin-filters{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}.admin-filters label{display:flex;align-items:center;gap:7px;font-size:14px}.admin-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.admin-item{border:1px solid #e5e7eb;border-radius:10px;padding:10px;font-size:13px}.admin-item img{width:100%;height:90px;object-fit:contain;background:#f9fafb}.admin-note{font-size:12px;color:#6b7280}.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0001;text-align:center;font-size:12px;color:#777}
</style></head><body><header class="top"><button class="admin-btn" id="adminOpen">Admin</button><h1>SOKANY</h1><input id="search" class="search" placeholder="Mahsulot nomi yoki artikul..." /></header><main class="wrap"><div class="meta" id="count">Katalog yuklanmoqda...</div><section class="grid" id="grid"></section></main><section class="admin-panel" id="adminPanel"><h2>Admin panel (test)</h2><p id="adminStats"></p><div class="admin-filters"><label><input type="checkbox" id="zeroPriceFilter"> Narxi 0 / kiritilmagan</label><label><input type="checkbox" id="noImageFilter"> Rasmi yo‘q</label></div><p class="admin-note">Belgilangan shartlarga mos mahsulotlar admin ro‘yxatiga o‘tadi va katalogdan yashiriladi. Test holati: sahifa yangilanganda tiklanadi.</p><div class="admin-items" id="adminItems"></div><button class="admin-btn" id="adminLogout">Chiqish</button></section><div class="admin-layer" id="adminLayer"><div class="admin-box"><h2>Admin kirish</h2><input id="adminLogin" placeholder="Login" autocomplete="username"><input id="adminPass" type="password" placeholder="Parol" autocomplete="current-password"><div class="admin-error" id="adminError"></div><button id="adminSubmit">Kirish</button><button id="adminCancel" style="background:#6b7280">Bekor qilish</button></div></div><button class="cart-toggle" id="cartToggle">Savatcha (0)</button><div class="cart-panel" id="cartPanel"><div class="cart-box"><button class="cart-close" id="cartClose">Yopish</button><h2>Savatcha</h2><div id="cartItems"></div><p id="cartTotal"></p></div></div><div class="foot">Sokany rasmiy do‘koni</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let products=[];let adminMoved=new Set();const cart={};
const money=v=>{const n=Number(String(v).replace(/[^0-9.,]/g,'').replace(',','.'));return Number.isFinite(n)?new Intl.NumberFormat('uz-UZ').format(n)+' so‘m':v};
function fallback(article){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="435"><rect width="100%" height="100%" fill="#f3f4f6"/><text x="50%" y="47%" text-anchor="middle" font-family="Arial" font-size="38" fill="#9ca3af">SOKANY</text><text x="50%" y="59%" text-anchor="middle" font-family="Arial" font-size="30" fill="#4b5563">'+article+'</text></svg>')}
function needsAdmin(p){const z=document.getElementById('zeroPriceFilter')?.checked,n=document.getElementById('noImageFilter')?.checked;if(!z&&!n)return false;return (!z||!p.price||Number(p.price)===0)&&(!n||!p.hasImage);}
function renderAdmin(){const moved=products.filter(needsAdmin);adminMoved=new Set(moved.map(p=>p.article+'|'+p.name));document.getElementById('adminStats').textContent='Katalogda '+(products.length-moved.length)+' ta, admin ro‘yxatida '+moved.length+' ta mahsulot.';const box=document.getElementById('adminItems');box.innerHTML='';for(const p of moved){const el=document.createElement('div');el.className='admin-item';el.textContent=p.name+' · '+p.article+' · '+(p.price||'Narx yo‘q');box.append(el);}}
function savedAdminRules(){try{return JSON.parse(localStorage.getItem('sokanyAdminRules')||'{"zeroPrice":false,"noImage":false}')}catch{return {zeroPrice:false,noImage:false}}}
function isHiddenBySavedRules(p){const r=savedAdminRules();return (r.zeroPrice&&(!p.price||Number(p.price)===0))||(r.noImage&&!p.hasImage)}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const items=products.filter(p=>!isHiddenBySavedRules(p)&&(p.name+' '+p.article+' '+p.sku).toLowerCase().includes(q));document.getElementById('count').textContent=items.length+' ta mahsulot';const grid=document.getElementById('grid');grid.innerHTML='';if(!items.length){grid.innerHTML='<div class="empty">Hozircha mahsulot topilmadi.</div>';return;}for(const p of items){const c=document.createElement('article');c.className='card';const img=document.createElement('img');img.className='photo';img.src=p.image||fallback(p.article);img.alt=p.name;img.loading='lazy';img.decoding='async';img.onerror=()=>{img.onerror=null;img.src=fallback(p.article)};const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=p.name;const sku=document.createElement('div');sku.className='sku';sku.textContent='Artikul: '+p.article;const price=document.createElement('div');price.className='price';price.textContent=money(p.price);const qty=document.createElement('div');qty.className='qty';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','Kamaytirish');const count=document.createElement('span');count.textContent=cart[p.article]||0;const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','Savatchaga qo‘shish');minus.onclick=()=>{cart[p.article]=Math.max(0,(cart[p.article]||0)-1);if(!cart[p.article])delete cart[p.article];render();renderCart()};plus.onclick=()=>{cart[p.article]=(cart[p.article]||0)+1;render();renderCart()};qty.append(minus,count,plus);info.append(name,sku,price,qty);c.append(img,info);grid.append(c);}}
function renderCart(){const n=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cartToggle').textContent='Savatcha ('+n+')';const box=document.getElementById('cartItems');box.innerHTML='';let total=0;for(const [article,q] of Object.entries(cart)){const p=products.find(x=>x.article===article);if(!p)continue;const price=Number(p.price)||0;total+=price*q;const row=document.createElement('div');row.className='cart-row';row.textContent=p.name+' × '+q+' — '+money(price*q);box.append(row)}document.getElementById('cartTotal').textContent='Jami: '+money(total);if(!Object.keys(cart).length)box.textContent='Savatcha bo‘sh.'}
document.getElementById('cartToggle').onclick=()=>{document.getElementById('cartPanel').style.display='flex';renderCart()};document.getElementById('cartClose').onclick=()=>document.getElementById('cartPanel').style.display='none';
document.getElementById('search').addEventListener('input',render);
const layer=document.getElementById('adminLayer'), panel=document.getElementById('adminPanel');
document.getElementById('adminOpen').onclick=()=>{layer.style.display='flex';document.getElementById('adminLogin').focus()};
document.getElementById('adminCancel').onclick=()=>{layer.style.display='none'};
document.getElementById('adminSubmit').onclick=()=>{const l=document.getElementById('adminLogin').value,p=document.getElementById('adminPass').value;if(l==='770217121'&&p==='1234'){window.location.href='/admin.html';}else document.getElementById('adminError').textContent='Login yoki parol noto‘g‘ri.'};
document.getElementById('adminLogout').onclick=()=>{panel.style.display='none';document.getElementById('adminPass').value='';};
document.getElementById('zeroPriceFilter').onchange=()=>{renderAdmin();render()};document.getElementById('noImageFilter').onchange=()=>{renderAdmin();render()};
fetch('/public/products/products_manifest.json').then(r=>{if(!r.ok)throw new Error('manifest');return r.json();}).then(d=>{products=d.map(p=>({...p,sku:p.article,hasImage:!!p.image,image:p.image?'/public/products/'+p.image:'',price:p.price??''}));render();}).catch(()=>{document.getElementById('count').textContent='Katalogni yuklab bo‘lmadi';});
</script></body></html>
