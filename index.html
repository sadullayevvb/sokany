<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sokany do‘kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17191d;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}.top{background:#111827;color:white;padding:20px 16px 16px;position:sticky;top:0;z-index:2}.top h1{margin:0 0 12px;font-size:23px}.search{width:100%;border:0;border-radius:12px;padding:13px 14px;font-size:15px;outline:none}.wrap{padding:14px 12px 90px}.meta{font-size:13px;color:#6b7280;margin:2px 3px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 1px 5px #1111;min-width:0}.photo{display:block;width:100%;aspect-ratio:1.38/1;object-fit:contain;object-position:center;background:#fff;padding:4px;image-rendering:auto}.info{padding:10px}.name{font-size:14px;font-weight:650;line-height:1.3;min-height:36px}.sku{font-size:12px;color:#777;margin:6px 0}.price{font-size:16px;font-weight:750;color:#111827}.empty{text-align:center;padding:45px 15px;color:#777;grid-column:1/-1}.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px #0001;text-align:center;font-size:12px;color:#777}
</style></head><body><header class="top"><h1>SOKANY</h1><input id="search" class="search" placeholder="Mahsulot nomi yoki artikul..." /></header><main class="wrap"><div class="meta" id="count">Katalog yuklanmoqda...</div><section class="grid" id="grid"></section></main><div class="foot">Sokany rasmiy do‘koni</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
let products=[];
const money=v=>{const n=Number(String(v).replace(/[^0-9.,]/g,'').replace(',','.'));return Number.isFinite(n)?new Intl.NumberFormat('uz-UZ').format(n)+' so‘m':v};
function fallback(article){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="435"><rect width="100%" height="100%" fill="#f3f4f6"/><text x="50%" y="47%" text-anchor="middle" font-family="Arial" font-size="38" fill="#9ca3af">SOKANY</text><text x="50%" y="59%" text-anchor="middle" font-family="Arial" font-size="30" fill="#4b5563">'+article+'</text></svg>')}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const items=products.filter(p=>(p.name+' '+p.article+' '+p.sku).toLowerCase().includes(q));document.getElementById('count').textContent=items.length+' ta mahsulot';const grid=document.getElementById('grid');grid.innerHTML='';if(!items.length){grid.innerHTML='<div class="empty">Hozircha mahsulot topilmadi.</div>';return;}for(const p of items){const c=document.createElement('article');c.className='card';const img=document.createElement('img');img.className='photo';img.src=p.image||fallback(p.article);img.alt=p.name;img.loading='lazy';img.decoding='async';img.onerror=()=>{img.onerror=null;img.src=fallback(p.article)};const info=document.createElement('div');info.className='info';const name=document.createElement('div');name.className='name';name.textContent=p.name;const sku=document.createElement('div');sku.className='sku';sku.textContent='Artikul: '+p.article;const price=document.createElement('div');price.className='price';price.textContent=money(p.price);info.append(name,sku,price);c.append(img,info);grid.append(c);}}
document.getElementById('search').addEventListener('input',render);
fetch('/products/products_manifest.json').then(r=>{if(!r.ok)throw new Error('manifest');return r.json();}).then(d=>{products=d.map(p=>({...p,sku:p.article, image:'/products/'+p.image, price:p.price??''}));render();}).catch(()=>{document.getElementById('count').textContent='Katalogni yuklab bo‘lmadi';});
</script></body></html>
