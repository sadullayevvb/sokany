<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOKANY Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:15px Arial,sans-serif}.wrap{max-width:760px;margin:28px auto;padding:18px}.panel{background:white;border-radius:16px;padding:22px;box-shadow:0 2px 12px #0001}h1{margin-top:0}.checks{display:grid;gap:16px;margin:22px 0}.checks label{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid #e5e7eb;border-radius:10px}.checks input{width:20px;height:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:12px 18px;background:#111827;color:white;font-size:15px;cursor:pointer}.secondary{background:#6b7280}.status{margin:14px 0;color:#047857}.small{font-size:13px;color:#6b7280}</style></head><body><main class="wrap"><section class="panel"><h1>Admin panel</h1><p class="small">Checkboxlarni tanlang, so‘ng “Saqlash”ni bosing. Saqlangan shartlar katalogda amal qiladi.</p><div class="checks"><label><input type="checkbox" id="zeroPrice"> Narxi 0 yoki narxi kiritilmagan mahsulotlar</label><label><input type="checkbox" id="noImage"> Rasmi yo‘q mahsulotlar</label></div><div class="actions"><button id="save">Saqlash</button><button class="secondary" id="back">Katalogga qaytish</button></div><div class="status" id="status"></div></section></main><script>
const KEY='sokanyAdminRules';function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{"zeroPrice":false,"noImage":false}')}catch{return {zeroPrice:false,noImage:false}}}
const r=read();document.getElementById('zeroPrice').checked=!!r.zeroPrice;document.getElementById('noImage').checked=!!r.noImage;
document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify({zeroPrice:document.getElementById('zeroPrice').checked,noImage:document.getElementById('noImage').checked}));document.getElementById('status').textContent='Saqlandi. Katalogdagi mahsulotlar yangilandi.'};
document.getElementById('back').onclick=()=>location.href='/';
</script></body></html>
